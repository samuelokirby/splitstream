[package]
name = "splitstream"
version = "0.1.0"
edition = "2024"

[dependencies]
aec-rs = "1.0.0"
cidre = { git = "https://github.com/yury/cidre", rev = "a5ce94f2600f096b13a8eefde1dbbce9dff89064" }
dotenvy = "0.15"
cargo-nextest = "0.9.103"
chrono = "0.4.42"
colored = "3.0.0"
config = "0.15.15"
cpal = "0.17.3"
fixed-resample = "0.9.1"
