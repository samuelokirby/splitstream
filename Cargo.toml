[package]
name = "splitstream"
version = "0.1.0"
edition = "2024"

[lib]
name = "splitstream"
path = "src/lib.rs"

[[bin]]
name = "splitstream"
path = "src/bin/splitstream.rs"

[features]
default = ["whisper", "parakeet"]
whisper  = ["dep:whisper-rs"]
parakeet = ["dep:parakeet-rs"]

[dependencies]
aec-rs = "1.0.0"
cidre = { git = "https://github.com/yury/cidre", rev = "a5ce94f2600f096b13a8eefde1dbbce9dff89064" }
chrono = "0.4.42"
colored = "3.0.0"
config = "0.15.15"
cpal = "0.17.3"
dotenvy = "0.15"
fixed-resample = "0.9.1"
futures-util = "0.3.31"
http = "1.3.1"
log = "0.4.28"
ogg = "0.9.2"
opus = "0.3.0"
ringbuf = "0.4.8"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["full"] }
tokio-tungstenite = { version = "0.27.0", features = ["native-tls"] }
tungstenite = "0.27.0"
parakeet-rs = { version = "0.3", optional = true }
whisper-rs = { version = "0.15", features = ["metal"], optional = true }

[dev-dependencies]
