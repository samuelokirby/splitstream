[package]
name = "splitstream"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "macOS and Windows system audio and microphone capture in parallel, with echo cancellation and real-time transcription (local or cloud)."
license = "MIT"
repository = "https://github.com/samuelokirby/splitstream"
homepage = "https://github.com/samuelokirby/splitstream"
documentation = "https://docs.rs/splitstream"
keywords = ["audio", "transcription", "speech-to-text", "macos", "system-audio"]
categories = ["multimedia::audio", "api-bindings"]
readme = "README.md"
exclude = ["assets/*", "models/*"]

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# Deliberately not `all-features`, and deliberately without default features.
# docs.rs cross-compiles to Apple targets from a Linux builder, so anything with
# a cmake/bindgen build.rs fails there: that is `aec-rs-sys` (hence
# `no-default-features`, since `aec` is a default feature) and whisper.cpp.
# `whisper` is `#[doc(hidden)]` and renders nothing anyway, and `cli` only
# affects the binaries, which docs.rs does not render. The two public backends
# are the whole documented surface.
no-default-features = true
features = ["deepgram", "parakeet"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "splitstream"
path = "src/lib.rs"

[[bin]]
name = "splitstream"
path = "src/bin/splitstream.rs"
required-features = ["cli"]

[[bin]]
name = "download-parakeet"
path = "src/bin/download_parakeet.rs"
required-features = ["cli"]

[[example]]
name = "parakeet"
path = "examples/parakeet.rs"
required-features = ["parakeet"]

[[example]]
name = "deepgram"
path = "examples/deepgram.rs"
required-features = ["deepgram"]

[features]
default = ["parakeet", "aec"]
# Acoustic echo cancellation (Speex, via aec-rs). On by default: without it the
# speaker's output bleeds into the microphone and the far end is transcribed
# twice, once per channel. Turning it off drops the only dependency that needs
# cmake and a C toolchain, which is also what lets docs.rs build this crate.
aec = ["dep:aec-rs"]
whisper  = ["dep:whisper-rs"]
parakeet = ["dep:parakeet-rs"]
deepgram = ["dep:opus", "dep:tokio-tungstenite", "dep:tungstenite", "dep:futures-util", "dep:http"]
# Dependencies needed only by the bundled binaries (`splitstream`, `download-parakeet`).
# Library users do not need this feature.
cli = ["dep:colored", "dep:config", "dep:dotenvy", "dep:env_logger", "dep:reqwest", "dep:sha2"]

[dependencies]
aec-rs = { version = "1.0.0", optional = true }
colored = { version = "3.0.0", optional = true }
config = { version = "0.15.15", optional = true }
cpal = "0.17.3"
dotenvy = { version = "0.15", optional = true }
env_logger = { version = "0.11.8", optional = true }
rubato = "0.16.2"
futures-core = "0.3.31"
futures-util = { version = "0.3.31", optional = true }
http = { version = "1.3.1", optional = true }
log = "0.4.28"
opus = { version = "0.3.0", optional = true }
ringbuf = "0.5.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = { version = "0.10", optional = true }
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["full"] }
tokio-tungstenite = { version = "0.27.0", features = ["native-tls"], optional = true }
tungstenite = { version = "0.27.0", optional = true }
parakeet-rs = { version = "0.3", optional = true }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false, optional = true }

# --- macOS ---
# `cidre` wraps Apple frameworks and its build script rejects any other target,
# so it must never enter a Windows dependency graph. Metal is likewise Apple-only.
[target.'cfg(target_os = "macos")'.dependencies]
cidre = "0.15"
whisper-rs = { version = "0.15", features = ["metal"], optional = true }

# --- Windows ---
# System audio comes from WASAPI loopback, which `cpal` reaches by opening an
# output device for input — so there is nothing extra to depend on. Whisper
# builds without Metal here and falls back to CPU.
[target.'cfg(target_os = "windows")'.dependencies]
whisper-rs = { version = "0.15", optional = true }

[dev-dependencies]
