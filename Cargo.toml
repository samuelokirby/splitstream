[package]
name = "splitstream"
version = "0.1.0"
edition = "2024"

[dependencies]
aec-rs = "1.0.0"
cargo-nextest = "0.9.103"
chrono = "0.4.42"
cidre = { git = "https://github.com/yury/cidre", rev = "a5ce94f2600f096b13a8eefde1dbbce9dff89064" }
colored = "3.0.0"
config = "0.15.15"
coreaudio-sys = "0.2.17"
fixed-resample = "0.9.1"
futures-util = "0.3.31"
hound = "3.5.1"
http = "1.3.1"
log = "0.4.28"
ogg = "0.9.2"
opus = "0.3.0"
ringbuf = "0.4.8"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
tokio = "1.47.1"
tokio-tungstenite = { version = "0.27.0", features = ["native-tls"] }
tokio-util = "0.7.16"
tungstenite = "0.27.0"
webrtc-audio-processing = { version = "0.4.0", features = ["bundled"] }
