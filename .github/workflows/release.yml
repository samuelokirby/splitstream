name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# A version bump landing on `main` creates the matching `vX.Y.Z` annotated tag
# and GitHub release. Pushing that tag then triggers the crates.io publish.

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    name: Tag on version bump
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14
    outputs:
      version: ${{ steps.v.outputs.version }}
      created: ${{ steps.v.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from Cargo.toml
        id: v
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version *= *"/ {print $2; exit}' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "tag v$version already exists; nothing to do"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create annotated tag
        if: steps.v.outputs.created == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.v.outputs.version }}" -m "splitstream v${{ steps.v.outputs.version }}"
          git push origin "v${{ steps.v.outputs.version }}"

      - name: Create GitHub release
        if: steps.v.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" \
            --title "v${{ steps.v.outputs.version }}" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."

  publish:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cmake (deepgram/opus build dependency)
        run: brew list cmake >/dev/null 2>&1 || brew install cmake
      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version *= *"/ {print $2; exit}' Cargo.toml)
          tag="${GITHUB_REF_NAME#v}"
          [ "$version" = "$tag" ] || { echo "tag $tag != Cargo.toml $version"; exit 1; }
      - run: cargo publish --dry-run
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
