# Configuration for the `splitstream` demo binary (cargo run --features cli).
# Library users configure everything through SplitStreamBuilder instead.

# If true, system audio is not captured until the app explicitly unmutes it.
compliance_mode_on_start = false

# Apply acoustic echo cancellation to the microphone using system audio as the
# reference signal.
echo_cancellation = true

# "parakeet" (local, default feature) | "deepgram" (cloud, `deepgram` feature)
transcription_backend = "parakeet"

# Required when transcription_backend = "parakeet".
# `download-parakeet` prints the path it wrote to; the default is
# ~/Library/Application Support/splitstream/models/parakeet-eou
parakeet_model_dir = "./models/parakeet-eou"

# Deepgram reads DEEPGRAM_API_KEY from the environment or from a .env file.
# There is no API key setting here — never commit a key to a config file.
